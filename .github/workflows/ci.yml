name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Mypy
        run: mypy

  unit-test:
    name: Unit test
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pytest-split
      - name: Write test durations
        run: |
          cat <<'EOF' > .test_durations
          {
            "tests/e2e/test_pipeline.py::test_rendered_board_tracks_scenario[steady]": 5.5,
            "tests/e2e/test_pipeline.py::test_rendered_board_tracks_scenario[cascade]": 5.5,
            "tests/e2e/test_pipeline.py::test_rendered_board_tracks_scenario[recovery]": 5.5,
            "tests/e2e/test_pipeline.py::test_rendered_board_tracks_scenario[brownout]": 5.5,
            "tests/integration/test_simulation.py::test_scenario_timeline[steady]": 10.0,
            "tests/integration/test_simulation.py::test_scenario_timeline[flapping]": 10.0,
            "tests/integration/test_simulation.py::test_scenario_timeline[cascade]": 10.0,
            "tests/integration/test_simulation.py::test_scenario_timeline[recovery]": 10.0,
            "tests/integration/test_simulation.py::test_scenario_timeline[brownout]": 10.0,
            "tests/integration/test_simulation.py::test_scenario_timeline[partition]": 10.0,
            "tests/integration/test_simulation.py::test_scenario_timeline[maintenance]": 10.0
          }
          EOF
      - name: Unit tests
        run: python -m pytest tests/unit
      - name: End-to-end tests
        run: python -m pytest tests/e2e --splits 3 --group ${{ matrix.group }}
      - name: Integration tests
        run: python -m pytest tests/integration --splits 3 --group ${{ matrix.group }}

  ui-check:
    name: UI check
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Render and assert DOM
        run: python -m status_board.ui_check
      - name: Upload UI snapshot
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-check-snapshot
          path: ui-snapshots/
          if-no-files-found: ignore

  smoke-test:
    name: Smoke test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Smoke tests
        run: python -m pytest tests/e2e
